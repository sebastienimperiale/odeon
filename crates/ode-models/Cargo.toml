[package]
name = "ode-models"
description = "Forward models of dynamical systems (spring chains, pendulums, Kepler, Lorenz, …) with their exact discrete flows, tangents and observation operators"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nalgebra = "0.34.1"
serde    = { version = "1", features = ["derive"], optional = true }

[features]
# Serialize/Deserialize on the parameter structs and observation enums
# (what `ode-models-spec` needs to make a model plain data).
serde = ["dep:serde"]
